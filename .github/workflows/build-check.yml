name: Build Check
on:
  pull_request:

permissions:
  contents: read

jobs:
  # Graphite CI optimization: skip redundant CI runs for stacked PRs.
  # See https://graphite.com/docs/stacking-and-ci
  optimize_ci:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      skip: ${{ steps.check_skip.outputs.skip }}
    steps:
      - name: Optimize CI
        id: check_skip
        uses: withgraphite/graphite-ci-action@402a89bc8aa6db18ae1f9c61953d001d5f9d828f # v0.0.11 tag (no formal releases)
        with:
          graphite_token: ${{ secrets.GRAPHITE_CI_OPTIMIZER_TOKEN }}

  build-collector:
    if: needs.optimize_ci.outputs.skip != 'true'
    needs:
      - optimize_ci
    runs-on: ubuntu-latest-8-cores
    strategy:
      matrix:
        target: [build-linux, build-darwin, build-windows]
    steps:
      - name: Checkout Sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # The DBDOT manifest (internal/dbdot/manifest.yaml) pulls in private
      # Dynatrace Go modules, so module fetches during the build need a token.
      # Same GitHub App as the collector's CI: contents:read on the scoped
      # repos, app ID in the PRIVATE_GO_MODULES_APP_ID actions variable and key
      # in the PRIVATE_GO_MODULES_APP_PRIVATE_KEY secret.
      - name: Grant access to private Dynatrace repos
        uses: ./.github/actions/private-go-modules
        with:
          app-id: ${{ vars.PRIVATE_GO_MODULES_APP_ID }}
          private-key: ${{ secrets.PRIVATE_GO_MODULES_APP_PRIVATE_KEY }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "internal/tools/go.mod"
          cache: false

      - name: Set up Go cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', 'internal/dbdot/manifest.yaml') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Builds a replica of DBDOT from internal/dbdot/manifest.yaml with every
      # contrib module replaced by this checkout. The build fetches Go modules;
      # a transient proxy blip here was the original PIPE-1058 failure
      # (build-collector/windows). retry.sh only retries on a transient-network
      # signature, so a real build failure still fails immediately.
      - name: Build DBDOT with Contrib Modules
        run: bash .github/scripts/retry.sh make ${{ matrix.target }}

  build-summary:
    if: always()
    needs: [optimize_ci, build-collector]
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          if [[ "${{ needs.build-collector.result }}" == "success" ]]; then
            echo "All builds succeeded"
          elif [[ "${{ needs.build-collector.result }}" == "skipped" ]]; then
            echo "Build skipped"
          else
            echo "Builds failed"
            exit 1
          fi
