name: DBDOT Manifest Drift
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Compares internal/dbdot/manifest.yaml with the collector's manifest on
      # main (public repo, fetched over HTTPS). Fails when a component or
      # replace exists in one but not the other; version differences are
      # warnings only. See internal/dbdot/README.md.
      - name: Check replica manifest against collector
        run: ./scripts/check-dbdot-drift.sh
