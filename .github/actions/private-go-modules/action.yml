name: Private Go modules access
description: >
  Mints a GitHub App installation token and routes git fetches of
  github.com/Dynatrace repos through it, so go can download the private
  Dynatrace modules the collector manifest pulls in (the proxy/sumdb
  bypass comes from GOPRIVATE, exported by the Makefile). Same App and
  mechanism as the collector repo's private-go-modules action.
inputs:
  app-id:
    description: ID of a GitHub App with contents:read on the private module repos
    required: true
  private-key:
    description: Private key of the GitHub App
    required: true
outputs:
  token:
    description: The installation token, for steps that need it directly (actions/checkout, raw.githubusercontent probes)
    value: ${{ steps.app-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Mint installation token
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # Scope the token to just the repos the build needs; extend this list
        # when the collector manifest gains another private module.
        repositories: dt-otelcol-edge-processing-components,dt-protocols-go
    - name: Route git fetches of Dynatrace repos through the token
      shell: bash
      env:
        TOKEN: ${{ steps.app-token.outputs.token }}
      run: git config --global url."https://x-access-token:${TOKEN}@github.com/Dynatrace/".insteadOf "https://github.com/Dynatrace/"
