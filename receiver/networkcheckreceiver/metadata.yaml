type: networkcheck

status:
  distributions: [Dynatrace-Bindplane]
  class: receiver
  stability:
    alpha: [metrics, logs]
  codeowners:
    active: [dynatrace/team-dynatrace-bindplane-maintainers]

resource_attributes:
  target.endpoint:
    type: string
    description: The configured target endpoint (IP address, hostname, or URL) with any userinfo removed.
    enabled: true

attributes:
  dns.query:
    type: string
    description: The name queried against the target DNS server (dns_query).
  dns.server:
    type: string
    description: The DNS server associated with the target, either the configured dns_server or the system resolver detected at startup. The detected resolver is reported as a bare address without a port.
  http.response.status_code:
    type: int
    description: The HTTP response status code.
  ping.method:
    type: string
    description: The method used to probe the target. Only icmp is emitted.
    enum:
      - icmp
  traceroute.hop.address:
    type: string
    description: The IP address of the traceroute hop, or * when the hop did not answer.
  traceroute.hop.index:
    type: int
    description: The traceroute hop index (TTL value).

metrics:
  network.dns.lookup_duration:
    enabled: true
    description: Time for the DNS server to answer the query. Emitted only when network.dns.status is 1.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [dns.query]

  network.dns.status:
    enabled: true
    description: 1 if the server answered NOERROR with at least one record of the configured type, 0 otherwise (another response code, no record of that type, or no answer before the timeout).
    unit: "1"
    stability: alpha
    gauge:
      value_type: int
    attributes: [dns.query]

  network.http.client_connection_duration:
    enabled: true
    description: Time from the start of the TCP dial until the connection was established.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [dns.server]

  network.http.dns_lookup_duration:
    enabled: true
    description: Time spent resolving the target hostname. Zero when the endpoint is an IP address.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [dns.server]

  network.http.duration:
    enabled: true
    description: Total duration of the HTTP request.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [http.response.status_code, dns.server]

  network.http.request_duration:
    enabled: true
    description: Time spent writing the HTTP request, excluding the TLS handshake.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [dns.server]

  network.http.response_duration:
    enabled: true
    description: Time from the request being written to the first response byte.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [dns.server]

  network.http.status:
    enabled: true
    description: 1 if an HTTP response was received, whatever its status code, 0 on connection error or timeout.
    unit: "1"
    stability: alpha
    gauge:
      value_type: int
    attributes: [http.response.status_code, dns.server]

  network.http.tls_handshake_duration:
    enabled: true
    description: Time spent completing the TLS handshake. Zero for non-TLS targets.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [dns.server]

  network.ping.latency_avg:
    enabled: true
    description: Average round-trip latency of the echo replies received.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [ping.method, dns.server]

  network.ping.latency_max:
    enabled: true
    description: Maximum round-trip latency of the echo replies received.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [ping.method, dns.server]

  network.ping.latency_min:
    enabled: true
    description: Minimum round-trip latency of the echo replies received.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [ping.method, dns.server]

  network.ping.packet_loss:
    enabled: true
    description: Fraction of echo requests that got no reply (0.0 to 1.0). 1 when the probe could not run, for example because the hostname did not resolve.
    unit: "1"
    stability: alpha
    gauge:
      value_type: double
    attributes: [ping.method, dns.server]

  network.traceroute.hop.latency:
    enabled: true
    description: Round-trip latency to a traceroute hop that answered. Not emitted for hops that did not answer.
    unit: ms
    stability: alpha
    gauge:
      value_type: double
    attributes: [traceroute.hop.index, traceroute.hop.address, dns.server]

  network.traceroute.hop.status:
    enabled: true
    description: 1 if the traceroute hop answered any of its probes within the per-hop timeout, 0 if it answered none. Averaged over time, the fraction of traces in which the hop answered.
    unit: "1"
    stability: alpha
    gauge:
      value_type: double
    attributes: [traceroute.hop.index, traceroute.hop.address, dns.server]

# The lifecycle test starts and stops the receiver without probing: the first
# scrape is held back by initial_delay, so no packet leaves the host.
tests:
  config:
    collection_interval: 1m
    initial_delay: 10s
    targets:
      - endpoint: 127.0.0.1
        method: icmp
        ping_count: 1
      - endpoint: http://127.0.0.1:9/
        method: http
        timeout: 1s
      - endpoint: 127.0.0.1
        method: dns
        dns_query: example.com
        timeout: 1s
