type: exabeam

status:
  codeowners:
    active: [dynatrace/team-dynatrace-bindplane-maintainers]
  class: exporter
  stability:
    alpha: [logs]
  distributions: [Dynatrace-Bindplane]

tests:
  skip_lifecycle: true
  skip_shutdown: true

attributes:
  bucket:
    description: The name of the Exabeam GCS bucket.
    type: string
  encoding:
    description: The encoding applied to the payload (ndjson/gzip).
    type: string
  error:
    description: The error classification for the request.
    type: string
    enum:
      - none
      - timeout
      - unknown
  location:
    description: The Exabeam GCS bucket location.
    type: string

telemetry:
  metrics:
    exporter_payload_size:
      enabled: true
      description: The size of the encoded and compressed file in bytes.
      stability: alpha
      unit: By
      histogram:
        value_type: int
        bucket_boundaries:
          [1e4, 5e4, 1e5, 2.5e5, 5e5, 7.5e5, 1e6, 2.5e6, 5e6, 7.5e6, 10e6]
      attributes:
        - encoding
        - bucket

    exporter_request_duration:
      enabled: true
      description: The duration of the upload request in milliseconds.
      stability: alpha
      unit: ms
      histogram:
        value_type: int
        bucket_boundaries:
          [100, 250, 500, 750, 1000, 2000, 3000, 5000, 7500, 10000, 15000, 20000, 30000, 45000, 60000, 90000, 120000]
      attributes:
        - error
        - bucket
        - location

    exporter_timeout_total:
      enabled: true
      description: The number of upload requests that resulted in a timeout.
      stability: alpha
      unit: "{requests}"
      sum:
        monotonic: true
        value_type: int
      attributes:
        - bucket

    exporter_upload_bytes_total:
      enabled: true
      description: The cumulative number of bytes uploaded to the Exabeam bucket.
      stability: alpha
      unit: By
      sum:
        monotonic: true
        value_type: int
      attributes:
        - bucket

    exporter_upload_inflight:
      enabled: true
      description: The number of uploads currently in flight.
      stability: alpha
      unit: "{uploads}"
      sum:
        value_type: int
      attributes:
        - bucket

sending_queue:
  support: has_overrides
  # Batches are sized in bytes and flushed after Exabeam's recommended max file size (10 MB)
  # or max open time (300s), so each batch becomes one file.
  overrides:
    enabled: true
    batch:
      enabled: true
      sizer: bytes
      min_size: 10000000
      max_size: 10000000
      flush_timeout: 300s
