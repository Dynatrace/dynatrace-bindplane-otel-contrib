type: exabeam

status:
  codeowners:
    active: [dynatrace/team-dynatrace-bindplane-maintainers]
  class: exporter
  stability:
    alpha: [logs]
  distributions: [Dynatrace-Bindplane]

tests:
  skip_lifecycle: true
  skip_shutdown: true

attributes:
  bucket:
    description: The name of the Exabeam GCS bucket.
    type: string
  encoding:
    description: The encoding applied to the payload (ndjson/gzip).
    type: string
  error:
    description: The error classification for the request.
    type: string
    enum:
      - none
      - timeout
      - unknown
  location:
    description: The Exabeam GCS bucket location.
    type: string

telemetry:
  metrics:
    exporter_batch_size:
      enabled: true
      description: The number of log records in each successfully uploaded file.
      stability: alpha
      unit: "{records}"
      histogram:
        value_type: int
        bucket_boundaries:
          [1, 100, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000]
      attributes:
        - bucket

    exporter_logs_send_failed:
      enabled: true
      description: The number of failed upload attempts, including ones that are retried and ones that are dropped. Counts failures, not log records.
      stability: alpha
      unit: "{failures}"
      sum:
        monotonic: true
        value_type: int
      attributes:
        - bucket

    exporter_payload_size:
      enabled: true
      description: The size of each successfully uploaded file in bytes, after encoding and compression.
      stability: alpha
      unit: By
      histogram:
        value_type: int
        bucket_boundaries:
          [1e4, 5e4, 1e5, 2.5e5, 5e5, 7.5e5, 1e6, 2.5e6, 5e6, 7.5e6, 10e6]
      attributes:
        - encoding
        - bucket

    exporter_raw_bytes:
      enabled: true
      description: The number of uncompressed NDJSON bytes uploaded successfully.
      stability: alpha
      unit: By
      sum:
        monotonic: true
        value_type: int
      attributes:
        - bucket

    exporter_request_count:
      enabled: true
      description: The number of upload requests made.
      stability: alpha
      unit: "{requests}"
      sum:
        monotonic: true
        value_type: int
      attributes:
        - error
        - bucket

    exporter_request_duration:
      enabled: true
      description: The duration of the upload request in milliseconds.
      stability: alpha
      unit: ms
      histogram:
        value_type: int
        bucket_boundaries:
          [100, 250, 500, 750, 1000, 2000, 3000, 5000, 7500, 10000, 15000, 20000, 30000, 45000, 60000, 90000, 120000]
      attributes:
        - error
        - bucket
        - location

    exporter_timeout_total:
      enabled: true
      description: The number of upload requests that resulted in a timeout.
      stability: alpha
      unit: "{requests}"
      sum:
        monotonic: true
        value_type: int
      attributes:
        - bucket

    exporter_unsplit_payload_size:
      enabled: true
      description: The uncompressed NDJSON size of a batch before it is split into files at max_file_size, recorded on every export attempt, including retries. A value above max_file_size means the batch is uploaded as more than one file.
      stability: alpha
      unit: By
      histogram:
        value_type: int
        bucket_boundaries:
          [1e5, 5e5, 1e6, 2.5e6, 5e6, 7.5e6, 1e7, 1.5e7, 2e7, 3e7, 5e7]
      attributes:
        - bucket

    exporter_upload_bytes_total:
      enabled: true
      description: The cumulative number of bytes uploaded to the Exabeam bucket.
      stability: alpha
      unit: By
      sum:
        monotonic: true
        value_type: int
      attributes:
        - bucket

    exporter_upload_inflight:
      enabled: true
      description: The number of uploads currently in flight.
      stability: alpha
      unit: "{uploads}"
      sum:
        value_type: int
      attributes:
        - bucket

sending_queue:
  support: has_overrides
  # Batches are sized in log records and flushed at 10,000 records (about Exabeam's recommended
  # 10 MB max file size at ~1 KB per record) or after Exabeam's max open time (300s). The exporter
  # splits a batch into several files at max_file_size, so no file is larger than 10 MB.
  # The queue is sized in requests. A queued request holds its slot until the batch it is in has
  # been uploaded, so queue_size covers the batch being filled and num_consumers uploading batches
  # for requests of 22 or more records on average.
  overrides:
    enabled: true
    sizer: requests
    queue_size: 5000
    batch:
      enabled: true
      sizer: items
      min_size: 10000
      max_size: 10000
      flush_timeout: 300s
